name: Node.js CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
          MONGO_INITDB_DATABASE: test_db
        options: >-
          --health-cmd "mongosh --eval 'db.serverStatus().ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://test:test@localhost:27017/test_db?authSource=admin&retryWrites=true&w=majority
      JWT_SECRET: test-secret-key-$(date +%s)
      JWT_EXPIRES_IN: 7d
      TEST_TIMEOUT: 30000

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        
    - name: Run linting
      run: npm run lint
      
    - name: Run tests
      run: |
        npm test -- --runInBand --detectOpenHandles --forceExit
        
    - name: Run coverage
      run: |
        npm run test:coverage -- --coverage --runInBand --detectOpenHandles --forceExit
      
    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/lcov.info
        fail_ci_if_error: false
        verbose: true
        working-directory: ./backend
