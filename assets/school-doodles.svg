<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="doodles" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Books -->
      <path d="M20 50 h40 v60 h-40 z M25 50 v60 M35 50 v60" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <!-- Pencil -->
      <path d="M80 30 l30 30 l-5 5 l-30 -30 z" fill="#3b6ea5"/>
      <!-- Calculator -->
      <path d="M120 80 h40 v50 h-40 z M125 90 h30 M125 100 h30 M125 110 h30" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <!-- Graduation Cap -->
      <path d="M40 140 l30 -20 l30 20 l-30 20 z" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <!-- Backpack -->
      <path d="M140 140 q20 0 20 20 v30 h-40 v-30 q0 -20 20 -20" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <!-- Globe -->
      <circle cx="60" cy="170" r="12" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <path d="M60 158 v24 M48 170 h24" stroke="#3b6ea5" stroke-width="1.5"/>
      <!-- Ruler -->
      <rect x="160" y="30" width="30" height="8" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <path d="M163 32 v4 M168 32 v4 M173 32 v4 M178 32 v4" stroke="#3b6ea5" stroke-width="1"/>
      <!-- Paint Palette -->
      <ellipse cx="180" cy="100" rx="12" ry="8" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <circle cx="175" cy="98" r="1.5" fill="#3b6ea5"/>
      <circle cx="185" cy="98" r="1.5" fill="#3b6ea5"/>
      <circle cx="180" cy="104" r="1.5" fill="#3b6ea5"/>
      <!-- Lightbulb -->
      <ellipse cx="100" cy="170" rx="7" ry="10" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <rect x="97" y="180" width="6" height="4" fill="#3b6ea5"/>
      <!-- Apple -->
      <circle cx="30" cy="30" r="7" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <path d="M30 23 q2 2 4 0" stroke="#3b6ea5" stroke-width="1.5"/>
      <!-- Paper Plane -->
      <polygon points="150,60 170,65 155,75" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <!-- Flask -->
      <rect x="60" y="110" width="8" height="20" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <ellipse cx="64" cy="130" rx="8" ry="4" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <!-- Music Note -->
      <path d="M190 150 v-15 l10 2 v15" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <circle cx="190" cy="150" r="2" fill="#3b6ea5"/>
      <circle cx="200" cy="152" r="2" fill="#3b6ea5"/>
      <!-- Star -->
      <polygon points="120,30 122,36 128,36 123,40 125,46 120,42 115,46 117,40 112,36 118,36" fill="none" stroke="#3b6ea5" stroke-width="2"/>
      <!-- Heart -->
      <path d="M140 60 q5 -10 10 0 q5 10 -10 20 q-15 -10 -10 -20 q5 -10 10 0" fill="none" stroke="#3b6ea5" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#doodles)"/>
</svg>
